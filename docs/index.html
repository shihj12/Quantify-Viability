<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ViabilityQuantifier</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      margin-top: 80px;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a3e;
      border-radius: 12px;
      padding: 32px 40px;
      max-width: 540px;
      width: 90%;
      text-align: center;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.3rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .download-btn {
      display: inline-block;
      background: #e21833;
      color: #fff;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .download-btn:hover { background: #c41530; }

    .card-sub {
      font-size: 0.9rem;
      color: #b0b0c0;
      margin-bottom: 16px;
    }

    .launch-btn {
      display: inline-block;
      background: #2f7d32;
      color: #fff;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .launch-btn:hover { background: #276a2a; }

    .version-info {
      font-size: 0.85rem;
      color: #707080;
      margin-top: 12px;
    }

    .footer {
      margin-top: auto;
      padding: 32px;
      text-align: center;
      font-size: 0.85rem;
      color: #505060;
    }

    .footer .logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-bottom: 12px;
    }

    .footer .logos img {
      height: 50px;
      width: auto;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>ViabilityQuantifier</h1>
  </div>

  <div class="card">
    <h2>Run in your browser</h2>
    <p class="card-sub">No install — quantify locally; your images never leave your computer.</p>
    <a class="launch-btn" href="app/">Launch web app</a>
  </div>

  <div class="card">
    <h2>Download for Windows</h2>
    <a class="download-btn" href="https://github.com/shihj12/Quantify-Viability/releases/latest/download/QuantifyViability-Setup.exe" id="download-link">
      Download ViabilityQuantifier
    </a>
    <div class="version-info" id="version-info">Loading latest version&hellip;</div>
  </div>

  <div class="footer">
    <div class="logos">
      <img src="img/logo_right.png" alt="Hao Research Group">
      <img src="img/logo_left.png" alt="University of Maryland" style="border-radius: 50%;">
    </div>
    <p>
      Hao Research Group &middot; University of Maryland<br>
    </p>
  </div>

  <script>
    // Fetch the latest release from the GitHub API to show the version and
    // point the button at the actual uploaded installer.
    fetch("https://api.github.com/repos/shihj12/Quantify-Viability/releases/latest")
      .then(r => r.json())
      .then(data => {
        if (!data.tag_name) return;
        document.getElementById("version-info").textContent =
          `Latest: ${data.tag_name} (${new Date(data.published_at).toLocaleDateString()})`;
        const exe = (data.assets || []).find(a => a.name.endsWith(".exe"));
        if (exe) document.getElementById("download-link").href = exe.browser_download_url;
      })
      .catch(() => {
        document.getElementById("version-info").textContent = "";
      });
  </script>

</body>
</html>
